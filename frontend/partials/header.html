<!-- Floating Country Cursor Tooltip -->
<div id="cursor-tooltip" class="cursor-tooltip">
  <img id="cursor-tooltip-flag" class="cursor-tooltip-flag" src="" alt="Flag" />
  <span id="cursor-tooltip-name" class="cursor-tooltip-name"></span>
</div>

<!-- Top Telemetry Header -->
<header class="hud-header">
  <div class="hud-stream-status-box">
    <div class="stream-status-pill">
      <span id="conn-status" class="mode-dot"></span>
      <span id="feed-stream-status">ACTIVE THREAT STREAM</span>
    </div>
  </div>

  <div class="hud-right-group">
    <div class="hud-telemetry">
      <div class="telemetry-block">
        <span class="label">TOTAL ATTACKS COUNTED</span>
        <span class="value" id="hud-attacks-total">0</span>
      </div>
      <div class="telemetry-block">
        <span class="label">ACTIVE ORIGINS</span>
        <span class="value" id="hud-active-origins">0 REGIONS</span>
      </div>
      <div class="telemetry-block">
        <span class="label">UTC TIME</span>
        <span class="value" id="hud-clock">00:00:00</span>
      </div>
    </div>

    <div class="user-profile-wrapper">
      <!-- Hover-only operator avatar (non-clickable) -->
      <div id="btn-user-profile" class="user-btn logged-out" aria-label="User Account">
        <img id="user-avatar-img" class="user-avatar-img" src="" alt="Avatar" style="display: none;" />
        <i id="user-default-icon" class="fa-solid fa-user-astronaut user-fa-icon"></i>
        <span id="user-auth-dot" class="user-auth-dot"></span>
      </div>

      <div class="user-dropdown-bridge">
        <div class="user-dropdown-menu">
          <div class="user-dropdown-header">
            <span id="dropdown-user-status" class="dropdown-status-label">UNAUTHENTICATED SESSION</span>
            <a id="dropdown-login-link" href="login.html" class="dropdown-login-pill">LOGIN</a>
          </div>
          <button id="menu-btn-operator" class="user-menu-btn" type="button">
            <i class="fa-solid fa-user-gear"></i>
            <span>OPERATOR SETTINGS</span>
          </button>
          <button id="menu-btn-locations" class="user-menu-btn" type="button">
            <i class="fa-solid fa-map-location-dot"></i>
            <span>MAP LOCATIONS</span>
          </button>
          <button id="menu-btn-feeds" class="user-menu-btn" type="button">
            <i class="fa-solid fa-satellite-dish"></i>
            <span>CUSTOM FEED OPTIONS</span>
          </button>
          <button id="menu-btn-github" class="user-menu-btn" type="button">
            <i class="fa-brands fa-github"></i>
            <span>GO TO GITHUB PROJECT</span>
          </button>
          <button id="menu-btn-logout" class="user-menu-btn danger-item disabled" type="button">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>LOGOUT</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
