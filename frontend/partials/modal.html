<!-- User Authentication & Settings Modal -->
<div id="user-modal-backdrop" class="modal-backdrop" style="display: none;">
  <div class="modal-card">
    <div class="modal-header">
      <span id="modal-title" class="modal-title">SOC OPERATOR AUTHENTICATION</span>
      <button id="btn-close-modal" class="modal-close-btn" type="button">✕</button>
    </div>

    <div id="modal-auth-view" class="modal-body">
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab active" type="button">LOGIN</button>
        <button id="tab-register" class="auth-tab" type="button">REGISTER</button>
      </div>

      <form id="auth-form" class="auth-form">
        <div class="form-group">
          <label for="auth-username">USERNAME</label>
          <input id="auth-username" type="text" placeholder="e.g. SOC_ANALYST_01" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label for="auth-password">SECURITY PASSKEY</label>
          <input id="auth-password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <div id="register-avatar-group" class="form-group" style="display: none;">
          <label>PROFILE ICON</label>
          <div class="avatar-upload-row">
            <div class="avatar-preview-box">
              <img id="reg-avatar-preview" src="" alt="Preview" style="display: none;" />
              <span id="reg-avatar-placeholder">?</span>
            </div>
            <label class="file-upload-btn">
              <i class="fa-solid fa-upload"></i> UPLOAD IMAGE
              <input id="reg-avatar-input" type="file" accept="image/*" hidden />
            </label>
          </div>
        </div>

        <div id="auth-error" class="auth-error" style="display: none;"></div>

        <button id="btn-auth-submit" class="modal-primary-btn" type="submit">AUTHENTICATE</button>
      </form>
    </div>

    <div id="modal-account-view" class="modal-body" style="display: none;">
      <div class="profile-summary">
        <div class="avatar-preview-box large">
          <img id="profile-avatar-preview" src="" alt="Operator Avatar" style="display: none;" />
          <span id="profile-avatar-placeholder"><i class="fa-solid fa-user-astronaut"></i></span>
        </div>
        <div class="profile-meta">
          <span class="profile-callsign" id="profile-username-display">OPERATOR</span>
          <span class="profile-status-tag">AUTHENTICATED</span>
          <label class="file-upload-btn small">
            <i class="fa-solid fa-camera"></i> CHANGE PROFILE ICON
            <input id="profile-avatar-input" type="file" accept="image/*" hidden />
          </label>
        </div>
      </div>
    </div>

    <div id="modal-feeds-view" class="modal-body" style="display: none;">
      <div class="sources-section">
        <div class="sources-header">
          <span>CONFIGURE CUSTOM THREAT FEEDS (URL OR IP:PORT)</span>
        </div>
        <div class="source-add-row">
          <input id="source-name-input" type="text" placeholder="Label (e.g. Feodo / Firewall)" />
          <input id="source-url-input" type="text" placeholder="Feed URL or IP:Port" />
          <button id="btn-add-source" class="source-add-btn" type="button">+ ADD</button>
        </div>
        <div id="custom-sources-list" class="custom-sources-list"></div>
      </div>
    </div>
  </div>
</div>
