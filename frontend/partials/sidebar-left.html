<!-- Left Sidebar Column -->
<aside class="sidebar-column left-column">
  <div class="deck-feed-card">
    <div class="feed-header">
      <span class="feed-tag">REAL-TIME INTRUSION FEED</span>
      <span class="feed-status" id="feed-mode-label">LIVE OSINT STREAM</span>
    </div>

    <!-- Stream Controls: Pause/Resume & Export JSON/CSV -->
    <div class="feed-Action-bar">
      <button id="btn-pause-stream" class="stream-ctrl-btn" type="button" title="Pause / Resume Live Stream">
        <i id="pause-icon" class="fa-solid fa-pause"></i>
        <span id="pause-label">PAUSE</span>
      </button>
      <div class="export-btn-group">
        <button id="btn-export-json" class="stream-ctrl-btn export-btn" type="button" title="Export Captured Packets as JSON">
          <i class="fa-solid fa-file-code"></i> JSON
        </button>
        <button id="btn-export-csv" class="stream-ctrl-btn export-btn" type="button" title="Export Captured Packets as CSV">
          <i class="fa-solid fa-file-csv"></i> CSV
        </button>
      </div>
    </div>

    <!-- Live Search Bar -->
    <div class="feed-search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input id="feed-search-input" type="text" placeholder="Filter threat, IP, port, ASN, country..." autocomplete="off" />
      <button id="btn-clear-search" class="search-clear-btn" type="button" style="display: none;" title="Clear Search">✕</button>
    </div>

    <!-- Severity Filter Bar -->
    <div class="feed-filter-bar">
      <button class="filter-chip active" data-severity="ALL" type="button">ALL</button>
      <button class="filter-chip" data-severity="HIGH" type="button">HIGH</button>
      <button class="filter-chip" data-severity="MEDIUM" type="button">MED</button>
      <button class="filter-chip" data-severity="LOW" type="button">LOW</button>
    </div>

    <!-- Pinned IPs Only Filter Button -->
    <button id="btn-filter-pinned" class="pinned-ip-filter-btn" type="button" title="Show only threat intelligence targeting your pinned IP addresses">
      <span class="pinned-filter-left">
        <i class="fa-solid fa-bullseye"></i>
        <span>ONLY PINNED IPs</span>
      </span>
      <span id="pinned-filter-badge" class="pinned-filter-state">OFF</span>
    </button>

    <div id="attack-ticker" class="attack-ticker">
      <div class="ticker-empty">LISTENING FOR OSINT INTRUSIONS...</div>
    </div>
  </div>

  <div id="country-intel" class="deck-intel-bar idle">
    <div class="intel-left">
      <div class="flag-wrapper">
        <img id="country-flag" class="country-flag" src="" alt="Flag" style="display: none;" />
        <div id="flag-placeholder" class="flag-placeholder">🌐</div>
      </div>
      <div class="intel-meta">
        <span id="country-name" class="intel-country">STANDBY</span>
        <span id="country-code" class="intel-code">ISO</span>
      </div>
    </div>
    <div id="coords-hud" class="coords-display">00.00° | 00.00°</div>
  </div>
</aside>

<!-- Floating Map Legend: Pinned Locations & Intrusion Alarm -->
<div id="pinned-nodes-hud" class="pinned-nodes-hud">
  <div class="pinned-hud-top">
    <div class="pinned-hud-title-group">
      <i class="fa-solid fa-map-pin pinned-hud-icon"></i>
      <span class="pinned-hud-title">PINNED NODES</span>
      <button id="btn-hud-filter-pinned" class="pinned-hud-filter-btn" type="button" title="Filter map & feed to show only attacks against pinned IPs">
        <i class="fa-solid fa-filter"></i>
      </button>
      <a href="locations.html" class="pinned-add-link" title="Configure Pinned Map Locations">+</a>
    </div>

    <!-- Flashing Alarm Indicator next to the Legend Header -->
    <div id="pinned-alarm-indicator" class="pinned-alarm-indicator standby">
      <i id="pinned-alarm-icon" class="fa-solid fa-bell"></i>
      <span id="pinned-alarm-text">STANDBY</span>
    </div>
  </div>

  <div id="pinned-nodes-list" class="pinned-nodes-list">
    <div class="pinned-nodes-empty">
      No nodes pinned. <a href="locations.html">Add in Map Locations →</a>
    </div>
  </div>
</div>

<!-- Floating Map Zoom, Pan & Borders Controls -->
<div id="map-zoom-controls" class="map-zoom-controls">
  <button id="btn-zoom-in" class="zoom-ctrl-btn" type="button" title="Zoom In (Scroll Up)">
    <i class="fa-solid fa-plus"></i>
  </button>
  <span id="zoom-level-label" class="zoom-level-badge" title="Current Map Zoom">1.0x</span>
  <button id="btn-zoom-out" class="zoom-ctrl-btn" type="button" title="Zoom Out (Scroll Down)">
    <i class="fa-solid fa-minus"></i>
  </button>
  <button id="btn-zoom-reset" class="zoom-ctrl-btn zoom-reset-btn" type="button" title="Reset Map View (1.0x)">
    <i class="fa-solid fa-expand"></i>
  </button>
  <div class="zoom-ctrl-divider"></div>
  <button id="btn-toggle-borders" class="zoom-ctrl-btn borders-toggle-btn" type="button" title="Toggle Country Borders Always On/Off">
    <i class="fa-solid fa-border-all"></i>
    <span>BORDERS</span>
  </button>
</div>
