<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    const hash = (window.location.hash || "").toLowerCase();
    if (hash.includes("location")) {
      window.location.replace("locations.html");
    } else if (hash.includes("feed")) {
      window.location.replace("feeds.html");
    } else {
      window.location.replace("operator.html");
    }
  </script>
</head>
<body style="background:#020610; color:#006FFF; font-family:monospace; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <a href="operator.html" style="color:#006FFF; text-decoration:none;">REDIRECTING TO OPERATOR SETTINGS...</a>
</body>
</html>
